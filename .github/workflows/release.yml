name: Release

# Publishing is driven by the tag, not by the <Version> in the csproj. That way
# there is only one place to get right, and a mistyped tag cannot ship a package
# numbered differently from the release it came from.
#
# Authentication uses NuGet Trusted Publishing: the job exchanges a GitHub OIDC
# token for an API key that lives for one hour. There is no long-lived secret to
# leak or rotate.
#
# IMPORTANT: the trust policy on nuget.org is bound to this file's *name*.
# Renaming or moving this workflow will break publishing until the policy is
# updated to match. See RELEASING.md.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish, without a leading v (e.g. 1.0.0 or 1.0.0-beta.1).'
        required: true
        type: string

jobs:
  release:
    name: Publish to NuGet
    runs-on: ubuntu-latest

    permissions:
      contents: write     # create the GitHub release
      id-token: write     # request the OIDC token for Trusted Publishing

    # The trust policy may be scoped to this environment. Add a required reviewer
    # to it in repo settings if you want a manual gate before anything ships.
    environment: nuget

    steps:
      - uses: actions/checkout@v4
        with:
          # Source Link embeds commit details, which needs the full history.
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [ -n "${INPUT_VERSION:-}" ]; then
            VERSION="$INPUT_VERSION"
          else
            VERSION="$GITHUB_REF_NAME"
          fi

          # Tolerate a leading "v" from either source; someone will always type it.
          VERSION="${VERSION#v}"

          # Refuse to publish something that is not a sensible version.
          if ! printf '%s' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$'; then
            echo "::error::'$VERSION' is not a valid semantic version."
            exit 1
          fi

          # A hyphen means a prerelease tag such as 1.0.0-beta.1.
          case "$VERSION" in
            *-*) PRERELEASE=true ;;
            *)   PRERELEASE=false ;;
          esac

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "Publishing version $VERSION (prerelease: $PRERELEASE)"

      # Fail before building rather than after, if the account is not configured.
      - name: Check the NuGet account is configured
        env:
          NUGET_USER: ${{ vars.NUGET_USER || secrets.NUGET_USER }}
        run: |
          set -euo pipefail

          if [ -z "${NUGET_USER:-}" ]; then
            echo "::error::Set NUGET_USER to your nuget.org username (the profile name, not your email address). See RELEASING.md."
            exit 1
          fi

      - name: Restore
        run: dotnet restore

      - name: Build
        run: >
          dotnet build --configuration Release --no-restore
          -p:Version=${{ steps.version.outputs.version }}

      # Never publish a version whose tests do not pass.
      - name: Test
        run: dotnet test --configuration Release --no-build

      - name: Pack
        run: >
          dotnet pack GeoCore/GeoCore.csproj --configuration Release --no-build
          -p:Version=${{ steps.version.outputs.version }}
          --output ./artifacts

      - name: List package contents
        run: |
          set -euo pipefail
          for package in ./artifacts/*.nupkg; do
            echo "== $package"
            unzip -l "$package"
          done

      # The issued key is valid for one hour and single-use, so request it here,
      # immediately before pushing, rather than at the top of the job.
      - name: Exchange the OIDC token for a short-lived NuGet key
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER || secrets.NUGET_USER }}

      # --skip-duplicate keeps a re-run from failing if the push already landed.
      # The adjacent .snupkg symbol package is picked up automatically.
      - name: Push to NuGet
        env:
          # Via env rather than inline, so the key cannot be rendered into the log.
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          set -euo pipefail

          dotnet nuget push './artifacts/*.nupkg' \
            --source https://api.nuget.org/v3/index.json \
            --api-key "$NUGET_API_KEY" \
            --skip-duplicate

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          PRERELEASE: ${{ steps.version.outputs.prerelease }}
        run: |
          set -euo pipefail

          FLAGS=(--title "v$VERSION" --generate-notes)
          if [ "$PRERELEASE" = "true" ]; then
            FLAGS+=(--prerelease)
          fi

          # A manual run has no tag of its own, so make one at the current commit.
          if ! git rev-parse "v$VERSION" >/dev/null 2>&1; then
            FLAGS+=(--target "$GITHUB_SHA")
          fi

          gh release create "v$VERSION" ./artifacts/*.nupkg "${FLAGS[@]}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nupkg-${{ steps.version.outputs.version }}
          path: ./artifacts/*
